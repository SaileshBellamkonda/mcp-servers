packages:
  - 'packages/*'
  - 'packages/shared/*'

catalog:
  '@cfworker/json-schema': ^4.1.1
  '@eslint/js': ^10.0.0
  '@hono/node-server': ^2.0.10
  '@modelcontextprotocol/hono': 2.0.0-alpha.2
  '@modelcontextprotocol/server': 2.0.0-alpha.2
  '@tsconfig/node24': ^24.0.5
  '@types/micromatch': ^4.0.10
  # Use Node.js 24 for now, as it is the latest stable version with full support for our dependencies + VS Code version 1.123 and above uses Node.js 24.
  # https://github.com/ewanharris/vscode-versions
  '@types/node': ^24.13.2
  # The extension's package.json repeats this exact version instead of using `catalog:`: `vsce package` reads
  # @types/vscode from the manifest and cannot resolve a catalog reference. It must not be newer than
  # `engines.vscode` there (a manifest test checks both).
  '@types/vscode': 1.125.0
  '@types/which': ^3.0.4
  '@vitest/coverage-v8': ^5.0.5
  '@vscode/vsce': ^4.1.0
  eslint: ^10.0.0
  gray-matter: ^4.0.3
  hono: ^4.13.11
  micromatch: ^4.0.8
  node-gyp: ^13.1.0
  oxlint: ^1.90.0
  oxlint-tsgolint: ^7.0.2005
  sqlite-vec: ^0.1.6
  tree-sitter: ^0.25.1
  tree-sitter-bash: ^0.25.1
  tree-sitter-c: ^0.24.1
  tree-sitter-c-sharp: ^0.23.5
  tree-sitter-cpp: ^0.23.4
  tree-sitter-go: ^0.25.0
  tree-sitter-java: ^0.23.5
  tree-sitter-javascript: ^0.25.0
  tree-sitter-php: ^0.24.2
  tree-sitter-python: ^0.25.0
  tree-sitter-ruby: ^0.23.1
  tree-sitter-rust: ^0.24.0
  tree-sitter-typescript: ^0.23.2
  tsdown: ^0.23.4
  tsx: ^4.23.15
  # Hold at 6.x: TS 7 (native Go compiler) ships no classic compiler API, and typescript-eslint
  # (typed linting in eslint.config.mjs) requires typescript <6.1.0. Revisit when typescript-eslint supports TS 7.
  typescript: ^6.0.0
  typescript-eslint: ^8.0.0
  vite: ^8.0.0
  vitest: ^5.0.5
  which: ^7.0.0
  zod: ^4.6.6

# gray-matter pins js-yaml 3.x, which has no patched 3.x range below 3.15.2 (merge-key / !!omap CPU DoS advisories).
# Do not raise to js-yaml 4+/5: gray-matter calls yaml.safeLoad/safeDump at require time, which 4+ removed,
# so importing gray-matter (and the coderag server) would throw. Moving to 5.x means replacing gray-matter.
overrides:
  'js-yaml@^3.13.1': ^3.15.2

allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  sqlite-vec: true
  tree-sitter: true
  tree-sitter-bash: true
  tree-sitter-c: true
  tree-sitter-c-sharp: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-php: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
